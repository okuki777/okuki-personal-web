# 国内轻量服务器 Nginx 配置示例
# 放到 /etc/nginx/conf.d/okuki.conf，然后 nginx -t && systemctl reload nginx
#
# 前提：
#   1. 域名已备案，并且已解析到这台服务器
#   2. 项目已 npm run build，Node 服务由 PM2 跑在 8080
#   3. 证书用 certbot 申请（或宝塔/1Panel 面板里点一下）

upstream okuki_node {
    server 127.0.0.1:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name okuki.example.com;          # ← 换成你的域名
    # certbot 会自己往里加 301 到 https

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name okuki.example.com;          # ← 换成你的域名

    # ── 证书（certbot 生成后填这里；用宝塔/1Panel 会自动填好）─────────────
    ssl_certificate     /etc/letsencrypt/live/okuki.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/okuki.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # ── 上传体积（暂时用不到，但以后加功能不用改配置）────────────────────
    client_max_body_size 20m;

    # ── 安全响应头 ────────────────────────────────────────────────────
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # ── 带 hash 的静态资源：长时间缓存，直接由 Nginx 发，不经过 Node ──────
    location /assets/ {
        alias /var/www/okuki/dist/assets/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
        try_files $uri =404;
    }

    # ── 大文件（壁纸视频）也交给 Nginx，支持 Range，播放更顺 ──────────────
    location ~* \.(mp4|webm|mp3)$ {
        root /var/www/okuki/dist;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }

    # ── 图片 ──────────────────────────────────────────────────────────
    location /img/ {
        root /var/www/okuki/dist;
        expires 7d;
        access_log off;
    }

    # ── API：反代给 Node（不缓存，播放地址有时效）───────────────────────
    location /api/ {
        proxy_pass http://okuki_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20s;
        # 让 API 的 Cache-Control 透传，别被 Nginx 覆盖
        proxy_buffering off;
    }

    # ── 其余（index.html、favicon 等）交给 Node ────────────────────────
    location / {
        proxy_pass http://okuki_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── gzip（Node 那边也会压，Nginx 这层先压一遍更快）──────────────────
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
